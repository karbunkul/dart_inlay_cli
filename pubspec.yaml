name: inlay
description: A command-line tool to automate code generation using inlay markers.
version: 1.0.0
repository: https://github.com/karbunkul/dart_inlay_cli

environment:
  sdk: ^3.11.0

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.1
  file: ^7.0.1
  glob: ^2.1.3
  interact: ^2.2.0
  mason_logger: ^0.3.5
  mustache_template: ^2.0.4
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  inlay: inlay
